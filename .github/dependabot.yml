# Configuration Dependabot pour IrcChat
version: 2

updates:
  # 1. Mise à jour de toutes les dépendances NuGet (1 seule PR)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      all-nuget-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps)"

  # 2. Mise à jour de toutes les GitHub Actions (1 seule PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    groups:
      actions-deps:
        patterns:
          - "*"
    assignees:
      - "olivier lefebvre"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # 3. Mise à jour des images Docker (1 seule PR)
  - package-ecosystem: "docker"
    directory: "/src/IrcChat.Api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
    groups:
      docker-deps:
        patterns:
          - "*"
    assignees:
      - "olivier lefebvre"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"